<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classes</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="Logo" />
      <h1>Emerald Valley Academy</h1>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><i class="fa fa-house"></i> Dashboard</a>
      <a href="studentmain.html"><i class="fa fa-user-graduate"></i> Students</a>
      <a href="classmain.html" class="active"><i class="fa fa-chalkboard-teacher"></i> Classes</a>
      <a href="filesmain.html"><i class="fa fa-folder-open"></i> Files</a>
      <a href="settings.html"><i class="fa fa-gear"></i> Settings</a>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <div class="main-area">
    <!-- Top Bar -->
    <header class="top-bar">
      <h2>Classes</h2>
      <div class="button-group">
        <button class="btn secondary">Export CSV</button>
        <a href="addclass.html" class="btn">Add Classes</a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="search-bar">
        <label>Add filter</label>
        <input type="text" placeholder="Search for a class" />
      </div>
      <div class="table-container">
        <table class="student-table" id="courses-table">
          <thead>
            <tr>
              <th>Course Code</th>
              <th>Course Name</th>
              <th>Credit</th>
              <th>Course Level</th>
            </tr>
          </thead>
          <tbody id="courses-body">
            <!-- 课程数据将由 JavaScript 插入 -->
          </tbody>
        </table>
      </div>

    </main>
  </div>
</body>
</html>
