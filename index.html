<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - EVA School</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="container">
    <div class="login-left">
      <h2>Welcome to EVA Automation</h2>
      
      <!-- 登录表单 -->
      <form id="login-form">
        <div class="input-group">
          <input type="text" id="username" placeholder="Username" required />
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder="Password" required />
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="remember" />
          <label for="remember">Remember Me</label>
        </div>
        <div class="button-group">
          <button type="button" class="btn secondary" id="signup-btn">Sign Up</button>
          <button type="submit" class="btn">Log In</button>
        </div>
        <p id="error-msg" style="color: red; margin-top: 10px; display: none;"></p>
      </form>
    </div>
    <div class="login-right">
      <img src="logo.png" alt="EVA Logo"/>
    </div>
  </div>

  <!-- 注册弹窗模态框 -->
  <div id="signup-modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-signup-modal" class="close-button">×</button>
      <h3>Sign Up</h3>
      <form id="signup-form">
        <div class="input-group">
          <input type="text" id="signup-username" placeholder="Username" required />
        </div>
        <div class="input-group">
          <input type="password" id="signup-password" placeholder="Password" required />
        </div>
        <div class="input-group">
          <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required />
        </div>
        <div class="input-group">
          <select id="signup-role" required>
            <option value="">Select Role</option>
            <option value="USER">User</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
        <button type="submit" class="btn">Create Account</button>
      </form>
      <p id="signup-error-msg" style="color: red; margin-top: 10px; display: none;"></p>
      <p id="signup-success-msg" style="color: green; margin-top: 10px; display: none;"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
